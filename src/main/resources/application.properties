spring.application.name=meetingRoomDemo
server.port=8080
app.server-url=http://localhost:8080

# ─── Database ─────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3308/mrdb?serverTimezone=Asia/Taipei&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Taipei

# ─── Jackson ──────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Taipei

# ─── JWT ──────────────────────────────────────────────────────────────────────
# IMPORTANT: Replace with a random secret >= 32 characters before production
app.jwt.secret=CHANGE_ME_TO_A_256_BIT_OR_LONGER_SECRET_KEY_AT_LEAST_32_CHARS
app.jwt.access-token-expiration-ms=3600000
app.jwt.refresh-token-expiration-ms=604800000

# ─── OAuth2 — Azure AD ────────────────────────────────────────────────────────
# (本地開發暫時停用，填入真實值後取消註解)
#spring.security.oauth2.client.registration.azure.client-id=AZURE_CLIENT_ID
#spring.security.oauth2.client.registration.azure.client-secret=AZURE_CLIENT_SECRET
#spring.security.oauth2.client.registration.azure.scope=openid,profile,email
#spring.security.oauth2.client.registration.azure.redirect-uri={baseUrl}/login/oauth2/code/azure
#spring.security.oauth2.client.registration.azure.authorization-grant-type=authorization_code
#spring.security.oauth2.client.provider.azure.issuer-uri=https://login.microsoftonline.com/AZURE_TENANT_ID/v2.0

# ─── OAuth2 — Google ──────────────────────────────────────────────────────────
# (本地開發暫時停用，填入真實值後取消註解)
#spring.security.oauth2.client.registration.google.client-id=GOOGLE_CLIENT_ID
#spring.security.oauth2.client.registration.google.client-secret=GOOGLE_CLIENT_SECRET
#spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ─── OAuth2 Frontend Redirect ─────────────────────────────────────────────────
app.oauth2.redirect-uri=http://localhost:5173/oauth2/callback

# ─── Redis ────────────────────────────────────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=5000ms

# ─── Mail (SMTP) ──────────────────────────────────────────────────────────────
# Set app.email.mock=false and fill in real credentials for production
app.email.mock=true
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL@gmail.com
spring.mail.password=YOUR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=noreply@yourdomain.com

# ─── Claude AI ────────────────────────────────────────────────────────────────
anthropic.api.key=anthropic.api.key
anthropic.model=claude-haiku-4-5-20251001

# ─── Springdoc / Swagger ──────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
